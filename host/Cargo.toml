[package]
name = "host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "policy-replay"
path = "src/main.rs"

[dependencies]
methods = { path = "../methods" }
risc0-zkvm = { version = "~2.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2.2"
hex = "0.4"
sha2 = "0.10"
anyhow = "1"
